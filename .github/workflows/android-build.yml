name: InfoVia - APK firmado y Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Configurar Firebase desde Secret (opcional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json generado desde el Secret."
          else
            echo "Se utilizará el google-services.json incluido en el proyecto."
          fi

      - name: Preparar firma de release
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          test -n "$SIGNING_KEYSTORE_BASE64" || (echo "Falta el Secret SIGNING_KEYSTORE_BASE64." && exit 1)
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > app/infovia-release.jks
          test -s app/infovia-release.jks || (echo "No se pudo crear el keystore." && exit 1)

      - name: Leer versión de InfoVia
        id: version
        run: |
          VERSION_NAME=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'versionCode =' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          test -n "$VERSION_NAME" || (echo "No se pudo leer versionName." && exit 1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "InfoVia v$VERSION_NAME (code $VERSION_CODE)"

      - name: Compilar APK release firmado
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/app/infovia-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD" || (echo "Falta SIGNING_STORE_PASSWORD." && exit 1)
          test -n "$SIGNING_KEY_ALIAS" || (echo "Falta SIGNING_KEY_ALIAS." && exit 1)
          test -n "$SIGNING_KEY_PASSWORD" || (echo "Falta SIGNING_KEY_PASSWORD." && exit 1)
          gradle assembleRelease --stacktrace --no-daemon

      - name: Verificar firma del APK
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK" || (echo "No se encontró el APK release." && exit 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"

      - name: Preparar APK con nombre final
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/InfoVia-v${{ steps.version.outputs.name }}.apk"
          ls -lh artifacts/InfoVia-v${{ steps.version.outputs.name }}.apk

      - name: Subir APK como artefacto de Actions
        uses: actions/upload-artifact@v4
        with:
          name: InfoVia-v${{ steps.version.outputs.name }}-release
          path: artifacts/InfoVia-v${{ steps.version.outputs.name }}.apk
          if-no-files-found: error

      - name: Crear o actualizar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          TAG="v${VERSION_NAME}"
          APK="artifacts/InfoVia-v${VERSION_NAME}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            echo "Release $TAG existente: APK reemplazado."
          else
            gh release create "$TAG" "$APK" \
              --title "InfoVia v${VERSION_NAME}" \
              --generate-notes \
              --target "${GITHUB_SHA}"
            echo "Release $TAG creada."
          fi
